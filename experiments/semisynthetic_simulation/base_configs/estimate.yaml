# Stage 2c: estimate causal effects from calibrated predictions.
logging:
  level: INFO
  path: ./outputs/logs/sim_study

paths:
  ## INPUTS
  calibrated_predictions: "{{INNER_DIR}}/models/bert/calibrated/"
  counterfactual_outcomes: "{{RUN_DIR}}/simulated_outcomes"

  ## OUTPUTS
  estimate: "{{INNER_DIR}}/estimate/bert"

estimator:
  methods: ["IPW", "TMLE", "TMLE_TH"]
  effect_type: "ATE"
  n_bootstrap: 30
  clip_percentile: 0.99

plot:
  contingency_table:
    max_outcomes_per_figure: 10
    max_number_of_figures: 10
  effect_size:
    max_outcomes_per_figure: 10
    max_number_of_figures: 10
    plot_individual_effects: false
  adjustment:
    max_outcomes_per_figure: 8
    max_number_of_figures: 10
