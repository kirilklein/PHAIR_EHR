# Stage 1b: prepare finetuning data from the FIXED cohort + simulated outcomes.
# Uses the existing cohort ({{COHORT}}) directly — no per-run cohort selection.
logging:
  level: INFO
  path: ./outputs/logs/sim_study

paths:
  ## INPUTS
  features: "{{FEATURES}}"
  tokenized: "{{TOKENIZED}}"
  cohort: "{{COHORT}}"                       # pre-existing cohort (pids + cohort_config.yaml)

  outcomes: "{{RUN_DIR}}/simulated_outcomes"
  outcome_files:
    - OUTCOME_NULL.csv
    - OUTCOME_MEDIUM.csv
    - OUTCOME_LARGE.csv

  # Exposure is read from the cohort (cohort/exposures.csv), so it is not set here.

  ## OUTPUTS
  prepared_data: "{{RUN_DIR}}/prepared_data"

data:
  type: finetune
  truncation_len: 64
  min_len: 2
  cv_folds: 2
  min_instances_per_class: 10
  max_items_per_plot: 15
  max_number_of_plots: 10
  number_subjects_to_plot: 10
  sample_num_patients: null
  sample_seed: 42

exposure:
  n_hours_censoring: -10
  n_hours_start_follow_up: -10
  n_hours_end_follow_up: 1000

outcome:
  n_hours_start_follow_up: 0
  n_hours_end_follow_up: null
  n_hours_compliance: null
  group_wise_follow_up: false
