logging:
  level: INFO
  path: ./outputs/logs

# Paths are injected by the Azure pipeline:
#   inputs:  prepared_data, finetune_model, subpopulation_pids (optional)
#   output:  model
# Trainer/model settings are loaded from finetune_model/finetune_config.yaml.
paths: {}

# By default test PIDs are included in CV folds (include_test_in_val: true).
# Set to false only if you intentionally want to exclude prepared_data/test_pids.pt.
include_test_in_val: true
