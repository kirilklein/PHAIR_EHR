logging:
  level: INFO
  path: ./outputs/logs

# Paths are injected by the Azure pipeline:
#   inputs:  prepared_data, finetune_model, subpopulation_pids (optional)
#   output:  model
# Trainer/model settings are loaded from finetune_model/finetune_config.yaml.
paths: {}

# If prepared_data/test_pids.pt exists, include those patients in fold creation
# (each appears in exactly one val fold) instead of excluding them.
include_test_in_val: true
